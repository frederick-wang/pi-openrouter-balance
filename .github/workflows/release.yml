name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm and Node.js
        uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Verify tarball file list (gate)
        run: node scripts/check-pack.mjs
      # OIDC trusted publisher: frederick-wang/pi-openrouter-balance + release.yml.
      # setup-node + registry-url is required; pnpm/setup alone yields ENEEDAUTH.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Assert version matches tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package version: $VERSION / tag: $TAG"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::package.json version $VERSION does not match tag v$TAG"
            exit 1
          fi
      # First release uses the repo NPM_TOKEN secret (npm requires a token
      # for the first package version). After configuring the npm OIDC
      # Trusted Publisher for frederick-wang/pi-openrouter-balance +
      # release.yml and deleting the secret, this same step publishes via
      # OIDC: the empty secret means the branch below unset the env first,
      # so npm never sees a configured-but-empty token.
      - name: Publish (token now; OIDC once the grant is configured)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "npm version: $(npm --version)"
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "auth: repository NODE_AUTH_TOKEN"
          else
            echo "auth: npm OIDC trusted publisher"
            unset NODE_AUTH_TOKEN
          fi
          npm publish --access public
